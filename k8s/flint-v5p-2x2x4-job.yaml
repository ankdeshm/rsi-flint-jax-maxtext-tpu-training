# Kubernetes Indexed Job + Headless Service for Full BF16 Training of Recursive Flint (39.8B MoE)
# Pulls all training scripts/configs directly from:
#   gs://YOUR_GCS_BUCKET/flint-jax-training
# Targets the `tpu-v5p-16-pool` node pool in GKE cluster `tpu-v5p-cluster` (`YOUR_GCP_PROJECT_ID`):
#   - Topology: 2x2x4 (4 hosts x 4 TPU v5p chips = 16 chips / 32 TensorCores / 1,520 GB HBM)
#   - Provisioning: Spot (`cloud.google.com/gke-spot: "true"`)
#   - Triggers GKE Cluster Autoscaler atomic scale-up (0 -> 4 nodes) on `tpu-v5p-16-pool`
---
apiVersion: v1
kind: Service
metadata:
  name: flint-v5p-headless
  namespace: default
  labels:
    app: flint-v5p-train
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-v5p-2x2x4-bf16-train
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v5p-2x2x4-bf16-train
  namespace: default
  labels:
    app: flint-v5p-train
    model: recursive-flint-40b-a2-5b
spec:
  backoffLimit: 10
  completions: 4
  parallelism: 4
  completionMode: Indexed
  template:
    metadata:
      labels:
        app: flint-v5p-train
    spec:
      subdomain: flint-v5p-headless
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
        cloud.google.com/gke-spot: "true"
      tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "cloud.google.com/gke-spot"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: local-ssd
          emptyDir: {}
      containers:
        - name: jax-tpu-trainer
          image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: JAX_PLATFORMS
              value: "tpu,cpu"
            - name: GRPC_DNS_RESOLVER
              value: "native"
            - name: GCS_BUCKET_ROOT
              value: "gs://YOUR_GCS_BUCKET/flint-jax-training"
            - name: BASE_OUTPUT_DIR
              value: "gs://YOUR_GCS_BUCKET/flint-jax-training/checkpoints"
            - name: HF_MODEL_ID
              value: "RecursiveSI/flint"
            - name: LIBTPU_INIT_ARGS
              value: >-
                --xla_tpu_scoped_vmem_limit_kib=65536
                --xla_tpu_overlap_compute_collective_tc=true
                --xla_enable_async_all_gather=true
                --xla_tpu_enable_ag_backward_pipelining=true
                --xla_tpu_enable_data_parallel_all_reduce_opt=true
                --xla_tpu_data_parallel_opt_different_sized_ops=true
                --xla_tpu_use_minor_sharding_for_major_trivial_input=true
                --xla_tpu_relayout_group_size_threshold_for_reduce_scatter=1
                --xla_tpu_assign_all_reduce_scatter_layout=true
                --xla_tpu_enable_scheduler_memory_pressure_tracking=true
                --xla_tpu_host_transfer_overlap_limit=24
                --xla_max_concurrent_host_send_recv=100
                --xla_tpu_scheduler_percent_shared_memory_limit=60
                --xla_tpu_use_enhanced_launch_barrier=false
                --slicebuilder_use_insecure_grpc=true
                --undefok=slicebuilder_use_insecure_grpc
          resources:
            requests:
              google.com/tpu: 4
              cpu: "100"
              memory: "350Gi"
            limits:
              google.com/tpu: 4
              cpu: "180"
              memory: "400Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: local-ssd
              mountPath: /scratch
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "=== Worker ${JOB_COMPLETION_INDEX} starting on $(hostname) ==="

              # Align TPU_WORKER_ID and TPU_WORKER_HOSTNAMES with physical GCE TPU slice order
              # Pull training package & configs directly from gs://YOUR_GCS_BUCKET/flint-jax-training
              mkdir -p /scratch/flint-jax-training
              gcloud storage cp -r "${GCS_BUCKET_ROOT}/*" /scratch/flint-jax-training/
              export PYTHONPATH="/scratch/flint-jax-training:${PYTHONPATH:-}"

              curl -sL https://huggingface.co/RecursiveSI/flint/raw/main/config.json -o /scratch/flint-jax-training/config.json

              set +e
              python3 -u -m flint_jax.train \
                --config-json=/scratch/flint-jax-training/config.json \
                --output-dir="${BASE_OUTPUT_DIR}" \
                --seq-len=4096 \
                --per-device-batch-size=1 \
                --data-parallel=1 \
                --fsdp-parallel=4 \
                --expert-parallel=4 \
                --tensor-parallel=1 \
                --steps=500 2>&1 | tee /scratch/train-worker-${JOB_COMPLETION_INDEX}.log
              TRAIN_EXIT_CODE=${PIPESTATUS[0]}
              gcloud storage cp /scratch/train-worker-${JOB_COMPLETION_INDEX}.log "${BASE_OUTPUT_DIR}/logs/train-worker-${JOB_COMPLETION_INDEX}.log" || true
              exit ${TRAIN_EXIT_CODE}
